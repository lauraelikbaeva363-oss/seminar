<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Семинарға тіркелу</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #6b5299;
            padding: 20px;
            color: #333;
        }

        .lang-switcher {
            max-width: 1000px;
            margin: 0 auto 10px auto;
            text-align: right;
        }

        .lang-btn {
            background: #fff;
            color: #4e3684;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s, color 0.2s;
        }

        .lang-btn:hover {
            background: #e4e0f5;
        }

        .header-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-card h1 {
            font-size: 20px;
            color: #222;
            margin-bottom: 8px;
        }

        .header-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-column {
            flex: 1.2;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .right-column {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .qr-card {
            background: #fff;
            padding: 20px 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .qr-item h4 {
            font-size: 11px;
            color: #444;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .qr-item a {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .qr-item a:hover {
            transform: scale(1.05);
        }

        .qr-item img {
            width: 175px;
            height: 175px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            padding: 5px;
            background: #fff;
        }

        .participants-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .participants-header {
            background: #6b52e0;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .participants-header h3 {
            font-size: 14px;
            font-weight: 500;
        }

        .participants-header .count {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        .check-btn {
            width: 100%;
            background: #4e3684;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        .check-btn:hover {
            background: #3b2765;
        }

        .participants-list {
            max-height: 220px;
            overflow-y: auto;
            font-size: 13px;
        }

        .participant-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }

        .submit-btn {
            width: 100%;
            background: #6b52e0;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #573ec7;
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">Русский</button>
    </div>

    <div class="header-card">
        <h1 id="orgName">Балалар және жасөспірімдер шығармашылық орталығы</h1>
        <p id="eventInfo">Өткізілетін күні мен уақыты: 23 Қазан 2026, 10:00 | Орны: Шонжы ауылы<br>
        Заманауи білім беру технологиялары мен оқыту әдістерін талқылау.<br>
        <small style="color: #888;" id="orgSub">Ұйымдастырушылар: Балалар және жасөспірімдер шығармашылық орталығы</small></p>
    </div>

    <div class="main-container">
        <div class="left-column">
            <h2 id="formTitle" style="text-align: center; font-size: 18px; margin-bottom: 4px;">Тіркелу</h2>
            <p id="formSub" style="text-align: center; font-size: 12px; color: #777; margin-bottom: 18px;">Қатысу үшін форманы толтырыңыз</p>

            <form id="registrationForm" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label id="labelFullName">Тегі, аты, әкесінің аты</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Аты-жөніңізді енгізіңіз" required>
                </div>
                <div class="form-group">
                    <label id="labelWorkplace">Жұмыс орны (мектеп атауы)</label>
                    <input type="text" id="workplace" name="workplace" placeholder="Мектеп атауы" required>
                </div>
                <div class="form-group">
                    <label id="labelPosition">Лауазымыңыз</label>
                    <select id="position" name="position">
                        <option value="" id="optSelectPos">Лауазымды таңдаңыз</option>
                        <option value="Мұғалім" id="optTeacher">Мұғалім</option>
                        <option value="Мектеп директоры" id="optDirector">Мектеп директоры</option>
                        <option value="Орынбасар" id="optDeputy">Орынбасар</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="labelRegion">Облысыңыз</label>
                    <select id="region" name="region" onchange="updateDistricts()">
                        <option value="" id="optSelectRegion">Тізімнен облысты таңдаңыз...</option>
                        <option value="Алматы облысы">Алматы облысы</option>
                        <option value="Жетісу облысы">Жетісу облысы</option>
                        <option value="Жамбыл облысы">Жамбыл облысы</option>
                        <option value="Түркістан облысы">Түркістан облысы</option>
                        <option value="Басқа">Басқа облыс</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="labelDistrict">Ауданыңыз</label>
                    <select id="district" name="district">
                        <option value="" id="optSelectDistrict">Алдымен облысты таңдаңыз...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="labelCity">Қала/аудан</label>
                    <input type="text" id="city" name="city" value="Шонжы ауылы">
                </div>
                <div class="form-group">
                    <label id="labelPhone">Телефон нөмірі</label>
                    <input type="text" id="phone" name="phone" placeholder="+7 (___) ___-__-__">
                </div>
                <div class="form-group">
                    <label id="labelExtra">Қосымша ақпарат</label>
                    <input type="text" id="extra" name="extra" value="—">
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Тіркелу</button>
            </form>
        </div>

        <div class="right-column">
            <div class="qr-card">
