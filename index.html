<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семинарға тіркелу</title>
    <style>
        body { background-color: #6b5299; padding: 40px 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .main-card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; max-width: 450px; width: 100%; box-sizing: border-box; }
        h1 { font-size: 20px; color: #222; margin-bottom: 10px; }
        p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
        .qr-box img { width: 220px; height: 220px; border: 1px solid #ddd; padding: 8px; border-radius: 8px; background: #fff; margin-bottom: 15px; }
        .direct-link { display: inline-block; background: #6b52e0; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .direct-link:hover { background: #573ec7; }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>Балалар және жасөспірімдер шығармашылық орталығы</h1>
        <p>«Білім берудегі инновациялар» семинары<br><strong>23 Қазан 2026, Шонжы ауылы</strong></p>
        
        <div class="qr-box">
            <p style="font-weight: bold; color: #444; margin-bottom: 8px;">ТІРКЕЛУ ҮШІН QR-ДЫ СКАНЕРЛЕҢІЗ:</p>
            <!-- Осы QR-код тікелей сіз сақтаған register.html мобильді формасына апарады -->
            <img src="https://quickchart.io/qr?text=https://lauraelikbaeva363-oss.github.io/seminar/register.html&size=250" alt="Тіркеу QR">
        </div>

        <div>
            <a href="register.html" class="direct-link">Форманы тікелей ашу</a>
        </div>
    </div>
</body>
</html>
