<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Семинарға тіркелу</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #6b5299;
            padding: 20px;
            color: #333;
        }

        .lang-switcher {
            max-width: 1000px;
            margin: 0 auto 10px auto;
            text-align: right;
        }

        .lang-btn {
            background: #fff;
            color: #4e3684;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-card h1 {
            font-size: 20px;
            color: #222;
            margin-bottom: 8px;
        }

        .header-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-column {
            flex: 1.2;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .right-column {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .qr-card {
            background: #fff;
            padding: 20px 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .qr-item h4 {
            font-size: 11px;
            color: #444;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .qr-item img {
            width: 175px;
            height: 175px;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 5px;
            background: #fff;
        }

        .participants-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .participants-header {
            background: #6b52e0;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .participants-header .count {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        .check-btn {
            width: 100%;
            background: #4e3684;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .participants-list {
            max-height: 220px;
            overflow-y: auto;
            font-size: 13px;
        }

        .participant-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }

        .submit-btn {
            width: 100%;
            background: #6b52e0;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">Русский</button>
    </div>

    <div class="header-card">
        <h1 id="orgName">Балалар және жасөспірімдер шығармашылық орталығы</h1>
        <p id="eventInfo">Өткізілетін күні мен уақыты: 23 Қазан 2026, 10:00 | Орны: Шонжы ауылы<br>Заманауи білім беру технологиялары мен оқыту әдістерін талқылау.</p>
    </div>

    <div class="main-container">
        <div class="left-column">
            <h2 id="formTitle" style="text-align: center; font-size: 18px; margin-bottom: 4px;">Тіркелу</h2>
            <p id="formSub" style="text-align: center; font-size: 12px; color: #777; margin-bottom: 18px;">Қатысу үшін форманы толтырыңыз</p>

            <form id="registrationForm" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label id="labelFullName">Тегі, аты, әкесінің аты</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Аты-жөніңізді енгізіңіз" required>
                </div>
                <div class="form-group">
                    <label id="labelWorkplace">Жұмыс орны (мектеп атауы)</label>
                    <input type="text" id="workplace" name="workplace" placeholder="Мектеп атауы" required>
                </div>
                <div class="form-group">
                    <label id="labelPosition">Лауазымыңыз</label>
                    <select id="position" name="position">
                        <option value="">Лауазымды таңдаңыз</option>
                        <option value="Мұғалім">Мұғалім</option>
                        <option value="Мектеп директоры">Мектеп директоры</option>
                        <option value="Орынбасар">Орынбасар</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="labelRegion">Облысыңыз</label>
                    <select id="region" name="region" onchange="updateDistricts()">
                        <option value="Алматы облысы" selected>Алматы облысы</option>
                        <option value="Жетісу облысы">Жетісу облысы</option>
                        <option value="Жамбыл облысы">Жамбыл облысы</option>
                        <option value="Түркістан облысы">Түркістан облысы</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="labelDistrict">Ауданыңыз</label>
                    <select id="district" name="district"></select>
                </div>
                <div class="form-group">
                    <label id="labelCity">Қала/аудан</label>
                    <input type="text" id="city" name="city" value="Шонжы ауылы">
                </div>
                <div class="form-group">
                    <label id="labelPhone">Телефон нөмірі</label>
                    <input type="text" id="phone" name="phone" placeholder="+7 (___) ___-__-__">
                </div>
                <div class="form-group">
                    <label id="labelExtra">Қосымша ақпарат</label>
                    <input type="text" id="extra" name="extra" value="—">
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Тіркелу</button>
            </form>
        </div>

        <div class="right-column">
            <div class="qr-card">
                <div class="qr-item">
                    <h4>ТІРКЕЛУ QR</h4>
                    <img src="https://quickchart.io/qr?text=https://lauraelikbaeva363-oss.github.io/seminar/&size=250" alt="QR">
                </div>
                <div class="qr-item">
                    <h4>КЕРІ БАЙЛАНЫС QR</h4>
                    <img src="https://quickchart.io/qr?text=https://forms.gle/uMJzbyZqmT1sbKij9&size=250" alt="QR">
                </div>
            </div>

            <div class="participants-card">
                <div class="participants-header">
                    <h3>Тіркелген қатысушылар</h3>
                    <div class="count" id="participantCount">0</div>
                </div>
                <button type="button" class="check-btn" onclick="loadRegistrations()">🔄 Тіркелгендерді тексеру</button>
                <div class="participants-list" id="participantsList"></div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbylYmSHV6gjGc-GyxKc_Ntis9JxZu-y3Md3TALYEgpil3UZjHjOnAoox-41evAlekY56Q/exec';

        const districts = ["Ұйғыр ауданы (Шонжы)", "Еңбекшіқазақ ауданы", "Талғар ауданы", "Қарасай ауданы", "Жамбыл ауданы", "Іле ауданы", "Қонаев қаласы"];

        function updateDistricts() {
            const districtSelect = document.getElementById('district');
            districtSelect.innerHTML = '';
            districts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                districtSelect.appendChild(opt);
            });
        }

        window.onload = function() {
            updateDistricts();
            loadRegistrations();
        };

        function loadRegistrations() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    if (data && Array.isArray(data)) {
                        document.getElementById('participantCount').textContent = data.length;
                        const listContainer = document.getElementById('participantsList');
                        listContainer.innerHTML = '';
                        data.reverse().forEach((item, index) => {
                            const newItem = document.createElement('div');
                            newItem.className = 'participant-item';
                            const num = data.length - index;
                            newItem.textContent = `${num}. ${item.fullName || 'Қатысушы'} (${item.workplace || ''})`;
                            listContainer.appendChild(newItem);
                        });
                    }
                })
                .catch(err => console.log(err));
        }

        function handleRegistration(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const workplace = document.getElementById('workplace').value.trim();

            if (!fullName || !workplace) {
                alert('Өтінемін, аты-жөніңізді және мектеп атауын енгізіңіз!');
                return;
            }

            const form = document.getElementById('registrationForm');
            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    alert('Құттықтаймыз, сіз сәтті тіркелдіңіз!');
                    window.location.reload();
                })
                .catch(error => {
                    alert('Құттықтаймыз, сіз сәтті тіркелдіңіз!');
                    window.location.reload();
                });
        }
    </script>
</body>
</html>
