<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семинарға тіркелу</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #6b5299;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
        }

        .register-card h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 4px;
        }

        .register-card p {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #6b52e0;
        }

        .submit-btn {
            width: 100%;
            background: #6b52e0;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #573ec7;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Тіркелу</h2>
        <p>Қатысу үшін форманы толтырыңыз</p>

        <!-- Деректерді Google Кестеге тікелей жіберетін форма -->
        <form id="mobileForm" 
              action="https://script.google.com/macros/s/AKfycbxjI9xGmFzFVHzshEBg88Z2pInDeBqRqrA3duvtPYKiRLQqlpcHoqMbHZBdyLVennFa/exec" 
              method="POST" 
              target="hidden_iframe" 
              onsubmit="submitted=true;">
            
            <div class="form-group">
                <label>Тегі, аты, әкесінің аты</label>
                <input type="text" name="fullName" id="fullName" placeholder="Аты-жөніңізді енгізіңіз" required>
            </div>

            <div class="form-group">
                <label for="workplace">Жұмыс орны (мектеп атауы)</label>
                <select id="workplace" name="workplace" required>
                    <option value="" disabled selected>Мекемеңізді таңдаңыз</option>
                    <option value="«Дене тәрбиесі, спорт, алғашқы әскери дайындығы және қосымша білім берудің ғылыми-тәжірибелік орталығы» КММ">«Дене тәрбиесі, спорт, алғашқы әскери дайындығы және қосымша білім берудің ғылыми-тәжірибелік орталығы» КММ</option>
                    <option value="МКҚК Саймасай ауылының «Балалар жасөспірімдер шығармашылық орталығы»">МКҚК Саймасай ауылының «Балалар жасөспірімдер шығармашылық орталығы»</option>
                    <option value="МКҚК Есік қаласының «Оқушылар үйі»">МКҚК Есік қаласының «Оқушылар үйі»</option>
                    <option value="МКҚК Түрген ауылының «Балалар-жасөспірімдер шығармашылық орталығы»">МКҚК Түрген ауылының «Балалар-жасөспірімдер шығармашылық орталығы»</option>
                    <option value="МКҚК Балтабай ауылының «Балалар-жасөспірімдер шығармашылық орталығы»">МКҚК Балтабай ауылының «Балалар-жасөспірімдер шығармашылық орталығы»</option>
                    <option value="МКҚК «Шелек ауылының Оқушылар үйі»">МКҚК «Шелек ауылының Оқушылар үйі»</option>
                    <option value="КМҚК «Жас Ұлан» оқушылар үйі">КМҚК «Жас Ұлан» оқушылар үйі</option>
                    <option value="МКҚК «Қарғалы ауылындағы балалар мен жасөспірімдер шығармашылық орталығы»">МКҚК «Қарғалы ауылындағы балалар мен жасөспірімдер шығармашылық орталығы»</option>
                    <option value="МКҚК «Жалағаш ауылының Балалар-жасөспірімдер шығармашылық орталығы»">МКҚК «Жалағаш ауылының Балалар-жасөспірімдер шығармашылық орталығы»</option>
                    <option value="МКҚК Нарынқол ауылы «Балалар-жасөспірімдер шығармашылық орталығы»">МКҚК Нарынқол ауылы «Балалар-жасөспірімдер шығармашылық орталығы»</option>
                    <option value="МКҚК «Оқушылар шығармашылық үйі»">МКҚК «Оқушылар шығармашылық үйі»</option>
                    <option value="МҚМ Жас техниктер станциясы">МҚМ Жас техниктер станциясы</option>
                    <option value="МКМ «Алматы облысының оқушылар үйі»">МКМ «Алматы облысының оқушылар үйі»</option>
                </select>
            </div>

            <div class="form-group">
                <label>Лауазымыңыз</label>
                <select name="position" id="position">
                    <option value="">Лауазымды таңдаңыз</option>
                    <option value="Мұғалім">Мұғалім</option>
                    <option value="Мектеп директоры">Мектеп директоры</option>
                    <option value="Орынбасар">Орынбасар</option>
                </select>
            </div>

            <div class="form-group">
                <label>Облысыңыз</label>
                <select name="region" id="region">
                    <option value="Алматы облысы" selected>Алматы облысы</option>
                </select>
            </div>

            <div class="form-group">
                <label for="district">Қала / ауыл</label>
                <select id="district" name="district" required>
                    <option value="" disabled selected>Елді мекенді таңдаңыз</option>
                    <option value="Қонаев қаласы">Қонаев қаласы</option>
                    <option value="Саймасай ауылы">Саймасай ауылы</option>
                    <option value="Есік қаласы">Есік қаласы</option>
                    <option value="Түрген ауылы">Түрген ауылы</option>
                    <option value="Балтабай ауылы">Балтабай ауылы</option>
                    <option value="Шелек ауылы">Шелек ауылы</option>
                    <option value="Жаңақұрылыс ауылы">Жаңақұрылыс ауылы</option>
                    <option value="Қарғалы ауылы">Қарғалы ауылы</option>
                    <option value="Жалағаш ауылы">Жалағаш ауылы</option>
                    <option value="Нарынқол ауылы">Нарынқол ауылы</option>
                    <option value="Талғар қаласы">Талғар қаласы</option>
                    <option value="Алатау кенті">Алатау кенті</option>
                    <option value="Сүмбе-Бірлік ауылы">Сүмбе-Бірлік ауылы</option>
                </select>
            </div>

            <div class="form-group">
                <label>Телефон нөмірі</label>
                <input type="text" name="phone" id="phone" placeholder="+7 (___) ___-__-__" required>
            </div>

            <div class="form-group">
                <label>Қосымша ақпарат</label>
                <input type="text" name="extra" id="extra" value="—">
            </div>

            <button type="submit" class="submit-btn">Тіркелу</button>
        </form>

        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { alert('Құттықтаймыз, сіз сәтті тіркелдіңіз!'); window.location.replace('https://lauraelikbaeva363-oss.github.io/seminar/'); }"></iframe>
    </div>

    <script>
        var submitted = false;
    </script>
</body>
</html>
