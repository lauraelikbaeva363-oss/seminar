<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кері байланыс</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #5c469c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card-custom {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 35px;
      max-width: 500px;
      width: 100%;
    }
    .btn-custom {
      background-color: #6c5ce7;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 10px;
      color: #fff;
    }
    .btn-custom:hover {
      background-color: #5b4bc4;
      color: #fff;
    }
    .form-control, .form-select {
      border-radius: 8px;
      padding: 10px 15px;
    }
    label {
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card-custom">
    <h3 class="text-center fw-bold mb-2">Кері байланыс</h3>
    <p class="text-center text-muted mb-4">Семинар туралы өз пікіріңіз бен ұсынысыңызды қалдырыңыз</p>

    <form onsubmit="event.preventDefault(); alert('Пікіріңіз сәтті жіберілді! Рақмет.');">
      <div class="mb-3">
        <label for="fullname">Аты-жөніңіз *</label>
        <input type="text" class="form-control" id="fullname" placeholder="Аты-жөніңізді енгізіңіз" required>
      </div>

      <div class="mb-3">
        <label for="workplace">Жұмыс орны (мектеп атауы) *</label>
        <select class="form-select" id="workplace" required>
          <option value="" disabled selected>Мекемеңізді таңдаңыз</option>
          <option value="school1">Балалар және жасөспірімдер шығармашылық орталығы</option>
          <option value="school2">Шонжы №1 орта мектебі</option>
          <option value="school3">Шонжы №2 орта мектебі</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="comments">Бүгінгі семинар туралы өз пікіріңіз бен ұсынысыңыз *</label>
        <textarea class="form-control" id="comments" rows="4" placeholder="Пікіріңізді осында жазыңыз..." required></textarea>
      </div>

      <button type="submit" class="btn btn-custom w-100">Жіберу</button>
    </form>
  </div>

</body>
</html>
